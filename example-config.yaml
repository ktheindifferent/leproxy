# Example LeProxy configuration file demonstrating YAML format
# This file can be loaded with --config flag

server:
  http_addr: ":8080"      # HTTP listen address for redirects and ACME challenges
  https_addr: ":8443"     # HTTPS listen address
  read_timeout: "30s"     # Maximum duration before timing out read
  write_timeout: "1m"     # Maximum duration before timing out write
  idle_timeout: "2m"      # How long idle connection is kept
  
  # ACME configuration for automatic certificate management
  acme:
    provider: "letsencrypt"       # Options: letsencrypt, zerossl, buypass, sslcom, entrust, google
    email: "admin@example.com"    # Contact email for ACME registration
    cache_dir: "/var/cache/certs" # Directory to cache certificates
    test_mode: false              # Use staging environment when available
    renew_before_days: 30         # Renew certificates X days before expiry
    
    # External Account Binding (required for some providers like ZeroSSL)
    # eab_kid: "your-eab-key-id"
    # eab_hmac: "your-eab-hmac-key"

# Host to backend mappings
mappings:
  # Simple HTTP backend
  example.com:
    url: "http://localhost:3000"
    health_check: "/health"
    max_connections: 100
    connect_timeout: "10s"
    request_timeout: "30s"
    retry_attempts: 3
    retry_delay: "1s"
    
  # API subdomain with custom headers
  api.example.com:
    url: "http://localhost:4000"
    headers:
      X-Forwarded-Proto: "https"
      X-Custom-Header: "value"
    websocket_path: "/ws"
    max_connections: 200
    
  # Static file serving (path with trailing /)
  static.example.com:
    url: "/var/www/static/"
    max_connections: 50

# Database proxy configuration
database_proxies:
  - name: "postgres-main"
    type: "postgres"
    listen: "0.0.0.0:5433"      # Listen address for TLS connections
    backend: "localhost:5432"    # Backend PostgreSQL server
    tls: true                    # Enable TLS for client connections
    cert_file: "/path/to/cert.pem"
    key_file: "/path/to/key.pem"
    pool:
      enabled: true
      min_conns: 5
      max_conns: 20
      max_lifetime: "30m"
      idle_timeout: "5m"
    timeouts:
      connect_timeout: "10s"
      read_timeout: "30s"
      write_timeout: "30s"
      idle_timeout: "5m"
      
  - name: "mysql-replica"
    type: "mysql"
    listen: "0.0.0.0:3307"
    backend: "mysql-server:3306"
    tls: true
    pool:
      enabled: true
      min_conns: 2
      max_conns: 10
      
  - name: "redis-cache"
    type: "redis"
    listen: "0.0.0.0:6380"
    backend: "redis-server:6379"
    tls: true

# Security configuration
security:
  # HSTS (HTTP Strict Transport Security)
  hsts:
    enabled: true
    max_age: 31536000         # 1 year in seconds
    include_subdomains: true
    preload: false
    
  # Rate limiting per IP
  rate_limit:
    enabled: true
    requests_per_second: 100
    burst: 200
    ttl: "3m"
    blacklist_ttl: "1h"
    
  # DDoS protection
  ddos_protection:
    enabled: true
    max_connections_per_ip: 100
    detection_window: "10s"
    detection_threshold: 50
    auto_blacklist_enabled: true
    auto_blacklist_duration: "1h"
    
  # IP filtering (optional)
  # whitelist_ips:
  #   - "192.168.1.100"
  # whitelist_cidrs:
  #   - "10.0.0.0/8"
  # blacklist_ips:
  #   - "1.2.3.4"

# Logging configuration
logging:
  level: "info"           # Options: debug, info, warn, error
  format: "json"          # Options: text, json
  output: "stdout"        # Options: stdout, stderr, file
  # file_path: "/var/log/leproxy.log"  # Required when output is "file"
  # max_size: 100         # Max size in MB before rotation
  # max_backups: 3        # Number of old files to retain
  # max_age: 7            # Days to retain old files
  # compress: true        # Compress rotated files

# Metrics configuration
metrics:
  enabled: true
  endpoint: "/metrics"
  port: 9090

# Advanced configuration
advanced:
  graceful_shutdown_timeout: "30s"
  enable_profiling: false
  profiling_port: 6060
  max_header_bytes: 1048576    # 1MB
  disable_http2: false
  
  # Distributed tracing configuration
  tracing:
    enabled: false
    service_name: "leproxy"
    environment: "production"
    exporter_type: "jaeger"     # Options: jaeger, otlp, stdout
    sample_rate: 1.0            # 0.0 to 1.0
    
    # Jaeger specific settings
    # jaeger_endpoint: "http://jaeger:14268"
    
    # OTLP specific settings
    # otlp_endpoint: "otlp-collector:4317"
    # otlp_insecure: true
    
    connection_timeout: "5s"
    export_timeout: "10s"
    max_retries: 3
    retry_delay: "1s"
    enable_exponential_backoff: true
    
    # Health check for tracing backend
    health_check_interval: "30s"
    health_check_timeout: "3s"
    
    # Fallback options
    enable_fallback: true
    fallback_to_stdout: true
    
    # Circuit breaker for tracing
    enable_circuit_breaker: true
    circuit_breaker_threshold: 5
    circuit_breaker_timeout: "30s"